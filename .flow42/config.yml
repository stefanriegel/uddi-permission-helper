schema_version: 1
forge: github
base_branch: main
concurrency: 1
worktree_parent: auto
commands:
  format: [none]
  lint: [none]
  typecheck: [none]
  test: [node, --test, tests/aws-generators.test.js]
  build: [none]
protected_paths: []
mandatory_gates:
  - intent
  - spec
  - high-risk-plan
  - irreversible-action
  - merge
  - deploy
